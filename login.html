
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar - FlowBank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">Flow<span>Bank</span></a>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Iniciar sesion</button>
        <button class="auth-tab" data-tab="registro">Crear cuenta</button>
      </div>

      <form id="formLogin" class="auth-form active">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Correo electronico</label>
          <input class="form-input" type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Contrasena</label>
          <input class="form-input" type="password" id="loginPassword" required>
        </div>
        <div class="form-message" id="loginMessage"></div>
        <button type="submit" class="btn-primary btn-large" style="width:100%; justify-content:center;">
          Iniciar sesion
        </button>
      </form>

      <form id="formRegistro" class="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="regNombres">Nombres</label>
            <input class="form-input" type="text" id="regNombres" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regApellidos">Apellidos</label>
            <input class="form-input" type="text" id="regApellidos" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="regCedula">Cedula</label>
            <input class="form-input" type="text" id="regCedula" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regTelefono">Telefono</label>
            <input class="form-input" type="tel" id="regTelefono" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="regEmail">Correo electronico</label>
          <input class="form-input" type="email" id="regEmail" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Contrasena (min. 8 caracteres)</label>
          <input class="form-input" type="password" id="regPassword" required minlength="8">
        </div>
        <div class="form-message" id="registroMessage"></div>
        <button type="submit" class="btn-primary btn-large" style="width:100%; justify-content:center;">
          Crear cuenta
        </button>
      </form>

      <p class="auth-footer">
        <a href="index.html">← Volver al inicio</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
