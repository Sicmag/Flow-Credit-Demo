<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexusPay - Tu banco digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=10">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="app-body">

  <!-- ============ TOPBAR ============ -->
  <header class="app-topbar">
    <a href="app.html" class="topbar-logo">
      <span class="logo-icon">🛡️</span>
      <span class="logo-text">Nexus<span>Pay</span></span>
    </a>

    <button class="menu-btn" id="menuBtn" aria-label="Abrir menu" onclick="toggleMenu()">
      <span class="menu-btn-line"></span>
      <span class="menu-btn-line"></span>
      <span class="menu-btn-line"></span>
    </button>
  </header>

  <!-- ============ MENU FULLSCREEN ============ -->
  <nav class="app-menu" id="appMenu">
    <div class="menu-content">

      <!-- Perfil -->
      <div class="menu-profile">
        <div class="menu-avatar" id="menuAvatar">👤</div>
        <div class="menu-profile-info">
          <div class="menu-profile-name" id="menuNombre">Cargando...</div>
          <div class="menu-profile-email" id="menuEmail">...</div>
          <div class="menu-profile-saldo" id="menuSaldo">$0</div>
        </div>
      </div>

      <!-- Cuenta -->
      <div class="menu-section">
        <div class="menu-section-title">Cuenta</div>
        <div class="menu-links">
          <button class="menu-link" data-page="perfil" onclick="navegarA('perfil')">
            <span class="menu-link-icon">👤</span>
            <span class="menu-link-label">Mi perfil</span>
          </button>
          <button class="menu-link" data-page="verificacion" onclick="navegarA('verificacion')">
            <span class="menu-link-icon">✓</span>
            <span class="menu-link-label">Verificación</span>
          </button>
          <button class="menu-link" data-page="notificaciones" onclick="navegarA('notificaciones')">
            <span class="menu-link-icon">🔔</span>
            <span class="menu-link-label">Notificaciones</span>
          </button>
          <button class="menu-link" onclick="toggleTema()">
            <span class="menu-link-icon" id="themeIcon">🌙</span>
            <span class="menu-link-label" id="themeToggleLabel">Modo oscuro</span>
          </button>
        </div>
      </div>
      
      <!-- Productos -->
      <div class="menu-section">
        <div class="menu-section-title">Productos</div>
        <div class="menu-links">
          <button class="menu-link" data-page="dashboard" onclick="navegarA('dashboard')">
            <span class="menu-link-icon">📊</span>
            <span class="menu-link-label">Dashboard</span>
          </button>
          <button class="menu-link" data-page="flowpay" onclick="navegarA('flowpay')">
            <span class="menu-link-icon">💸</span>
            <span class="menu-link-label">NexusPagos</span>
          </button>
          <button class="menu-link" data-page="flowcard" onclick="navegarA('flowcard')">
            <span class="menu-link-icon">🎴</span>
            <span class="menu-link-label">NexusCard</span>
          </button>
          <button class="menu-link" data-page="flowsave" onclick="navegarA('flowsave')">
            <span class="menu-link-icon">🏦</span>
            <span class="menu-link-label">NexusSave</span>
          </button>
          <button class="menu-link" data-page="flowinvest" onclick="navegarA('flowinvest')">
            <span class="menu-link-icon">📈</span>
            <span class="menu-link-label">NexusInvest</span>
          </button>
          <button class="menu-link" data-page="flowshield" onclick="navegarA('flowshield')">
            <span class="menu-link-icon">🛡️</span>
            <span class="menu-link-label">NexusShield</span>
          </button>
          <button class="menu-link" data-page="flowbusiness" onclick="navegarA('flowbusiness')">
            <span class="menu-link-icon">💼</span>
            <span class="menu-link-label">NexusBusiness</span>
          </button>
          <button class="menu-link" data-page="flowanalytics" onclick="navegarA('flowanalytics')">
            <span class="menu-link-icon">📊</span>
            <span class="menu-link-label">NexusAnalytics</span>
          </button>
          <button class="menu-link" data-page="nexusbox" onclick="navegarA('nexusbox')">
  <span class="menu-link-icon">🎁</span>
  <span class="menu-link-label">NexusBox</span>
</button>
          <button class="menu-link" data-page="creditos" onclick="navegarA('creditos')">
            <span class="menu-link-icon">💳</span>
            <span class="menu-link-label">NexusCredit</span>
          </button>
        </div>
      </div>

      

      <!-- Info -->
      <div class="menu-section">
        <div class="menu-section-title">Información</div>
        <div class="menu-links">
          <a href="privacidad.html" target="_blank" class="menu-link">
            <span class="menu-link-icon">🔒</span>
            <span class="menu-link-label">Privacidad</span>
          </a>
          <a href="terminos.html" target="_blank" class="menu-link">
            <span class="menu-link-icon">📄</span>
            <span class="menu-link-label">Términos</span>
          </a>
        </div>
      </div>

      <!-- Cerrar sesión -->
      <div class="menu-section">
        <button class="menu-link menu-link-danger" onclick="cerrarSesion()">
          <span class="menu-link-icon">🚪</span>
          <span class="menu-link-label">Cerrar sesión</span>
        </button>
      </div>

      <!-- Footer del menú -->
      <div class="menu-footer">
        <div class="menu-footer-brand">NexusPay · 2026</div>
        <div class="menu-footer-sub">Proyecto SENA</div>
      </div>

    </div>
  </nav>

  <!-- ============ CONTENIDO PRINCIPAL ============ -->
  <main class="app-content">
    <div class="page-header-app">
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <p class="page-subtitle" id="pageSubtitle">Vista general de tu banco digital</p>
    </div>
    <div id="pageContent">
      <div class="loading-spinner"></div>
    </div>
  </main>

  <!-- ============ FAB CHAT LUCI ============ -->
  <button class="chat-fab" id="chatFab" onclick="toggleChat()" aria-label="Chat con Luci">💬</button>

  <!-- ============ CHAT WINDOW ============ -->
  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-header-name">Luci</div>
        <div class="chat-header-status">En línea</div>
      </div>
      <button class="chat-close" onclick="toggleChat()">×</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-message chat-bot">
        Hola! Soy Luci, tu asistente de NexusPay. ¿En qué te ayudo hoy? 💜
      </div>
    </div>
    <div class="chat-input-wrapper">
      <input class="chat-input" id="chatInput" placeholder="Escribe tu pregunta..." onkeypress="if(event.key==='Enter') enviarChat()">
      <button class="chat-send" onclick="enviarChat()">➤</button>
    </div>
  </div>

  <!-- ============ SCRIPTS ============ -->
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/app.js"></script>
  <script src="js/loader.js"></script>
</body>
</html>
